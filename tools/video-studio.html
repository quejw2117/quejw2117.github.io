<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阙嘉炜 · 视频内容工作台</title>
  <style>
    :root { color-scheme:dark; --bg:#0a0b0d; --panel:#121418; --line:#2b2f36; --muted:#8c929d; --accent:#c9ff4a; --paper:#f3f4ef; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--paper); font:14px/1.55 Arial,"Microsoft YaHei",sans-serif; }
    button,input,textarea,select { font:inherit; }
    button { min-height:42px; border:1px solid var(--line); background:#191c21; color:var(--paper); padding:0 15px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); color:#090a0c; border-color:var(--accent); font-weight:700; }
    button.danger { color:#ff9e9e; }
    .topbar { position:sticky; z-index:20; top:0; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px clamp(18px,4vw,64px); border-bottom:1px solid var(--line); background:rgba(10,11,13,.94); backdrop-filter:blur(16px); }
    .brand strong { display:block; font-size:17px; letter-spacing:-.02em; }
    .brand span { color:var(--muted); font:10px/1.4 Consolas,monospace; letter-spacing:.12em; }
    .top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    main { width:min(1180px,calc(100% - 36px)); margin:42px auto 100px; }
    .intro { display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-bottom:34px; }
    h1 { margin:0; font-size:clamp(38px,6vw,82px); font-weight:500; line-height:.95; letter-spacing:-.055em; }
    .intro p { max-width:560px; margin:0; align-self:end; color:#a7abb2; font-size:15px; }
    #status { min-height:48px; margin:0 0 18px; padding:13px 16px; border:1px solid var(--line); color:#b8bec8; background:#0d0f12; }
    #status.good { color:var(--accent); border-color:#50652c; }
    #status.bad { color:#ff9e9e; border-color:#6b3434; white-space:pre-wrap; }
    .category { margin:0 0 18px; border:1px solid var(--line); background:var(--panel); }
    .category-head { display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center; padding:18px; border-bottom:1px solid var(--line); }
    .category-index { color:var(--accent); font:12px Consolas,monospace; }
    .category-head h2 { margin:0; font-size:26px; font-weight:520; }
    .category-head p { margin:2px 0 0; color:var(--muted); }
    .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .category-body { padding:20px; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    label { display:flex; flex-direction:column; gap:7px; color:#b6bbc4; font-size:12px; }
    label.wide { grid-column:1/-1; }
    input,textarea,select { width:100%; border:1px solid var(--line); border-radius:0; background:#0c0e11; color:var(--paper); padding:11px 12px; outline:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--accent); }
    textarea { min-height:82px; resize:vertical; }
    .covers { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0 26px; }
    .upload-box { padding:14px; border:1px dashed #3d424b; background:#0d0f12; }
    .upload-box img,.upload-box video { display:block; width:100%; aspect-ratio:16/9; margin-bottom:10px; object-fit:cover; background:#050607; }
    .upload-box input[type=file] { padding:8px; }
    .videos-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 12px; }
    .videos-title h3 { margin:0; font-size:18px; }
    .video { display:grid; grid-template-columns:180px minmax(0,1fr); gap:16px; padding:16px; border-top:1px solid var(--line); background:#0e1013; }
    .video-media video,.video-media img { width:100%; aspect-ratio:9/16; object-fit:cover; background:#050607; }
    .video-media .empty { display:grid; place-items:center; width:100%; aspect-ratio:9/16; border:1px dashed #3c4149; color:var(--muted); }
    .video-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .video-toolbar { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:10px; }
    .video-toolbar strong { font-size:16px; }
    .help { margin-top:18px; color:var(--muted); font-size:12px; }
    @media(max-width:760px){.topbar{align-items:flex-start}.intro{grid-template-columns:1fr}.fields,.covers,.video-fields{grid-template-columns:1fr}.video{grid-template-columns:1fr}.video-media{width:min(220px,100%)}label.wide{grid-column:auto}.category-head{grid-template-columns:auto 1fr}.category-head .row-actions{grid-column:1/-1}.top-actions button:first-child{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>视频内容工作台</strong><span>LOCAL ONLY · 不会展示在公开网站</span></div>
    <div class="top-actions"><button onclick="window.open('https://quejw2117.github.io','_blank')">查看网站 ↗</button><button id="saveButton">保存草稿</button><button class="primary" id="publishButton">保存并发布</button></div>
  </header>
  <main>
    <section class="intro"><h1>管理分类、标题<br>与视频。</h1><p>这里的修改只有点击“保存并发布”后才会上线。你可以增减分类和视频、调整顺序、修改小标题，并直接选择电脑里的视频与封面。</p></section>
    <div id="status">正在读取内容…</div><div id="categories"></div><button id="addCategory">＋ 新增视频分类</button>
    <p class="help">上传限制：单个文件不超过 95MB；视频使用 MP4/WebM，封面使用 JPG/PNG/WebP。删除条目只会让它从网站消失，不会立即删除电脑里的原文件。</p>
  </main>
  <script>
    let library={categories:[]},dirty=false;
    const root=document.querySelector('#categories'),statusBox=document.querySelector('#status');
    const escapeHtml=(value='')=>String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const textField=(label,value,ci,field,wide=false)=>`<label class="${wide?'wide':''}">${label}<input value="${escapeHtml(value)}" data-ci="${ci}" data-field="${field}"></label>`;
    const areaField=(label,value,ci,field)=>`<label class="wide">${label}<textarea data-ci="${ci}" data-field="${field}">${escapeHtml(value)}</textarea></label>`;
    const videoField=(label,value,ci,vi,field,wide=false,area=false)=>`<label class="${wide?'wide':''}">${label}${area?`<textarea data-ci="${ci}" data-vi="${vi}" data-vfield="${field}">${escapeHtml(value)}</textarea>`:`<input value="${escapeHtml(value)}" data-ci="${ci}" data-vi="${vi}" data-vfield="${field}">`}</label>`;
    function setStatus(message,type=''){statusBox.textContent=message;statusBox.className=type}
    function markDirty(){dirty=true;setStatus('有尚未保存的修改。')}
    function move(array,from,to){if(to<0||to>=array.length)return;const[item]=array.splice(from,1);array.splice(to,0,item);render();markDirty()}
    function render(){root.innerHTML=library.categories.map((category,ci)=>`
      <section class="category"><div class="category-head"><span class="category-index">${String(ci+1).padStart(2,'0')}</span><div><h2>${escapeHtml(category.title||'未命名分类')}</h2><p>${escapeHtml(category.subtitle||'请填写分类小标题')}</p></div><div class="row-actions"><button data-action="cat-up" data-ci="${ci}">↑</button><button data-action="cat-down" data-ci="${ci}">↓</button><button class="danger" data-action="cat-remove" data-ci="${ci}">删除分类</button></div></div>
      <div class="category-body"><div class="fields">${textField('分类标题',category.title,ci,'title')}${textField('分类小标题',category.subtitle,ci,'subtitle')}${textField('英文眉题',category.eyebrow,ci,'eyebrow')}${textField('页面路径（英文）',category.slug,ci,'slug')}<label>视觉风格<select data-ci="${ci}" data-field="tone"><option value="mass" ${category.tone==='mass'?'selected':''}>明快商业</option><option value="luxury" ${category.tone==='luxury'?'selected':''}>高奢暗调</option></select></label>${areaField('分类说明',category.description,ci,'description')}</div>
      <div class="covers">${[0,1].map(index=>`<div class="upload-box">${category.covers[index]?`<img src="..${escapeHtml(category.covers[index])}" alt="分类封面 ${index+1}">`:''}<label>分类封面 ${index+1}<input value="${escapeHtml(category.covers[index]||'')}" data-ci="${ci}" data-cover="${index}"><input type="file" accept="image/jpeg,image/png,image/webp" data-upload="cover" data-ci="${ci}" data-cover="${index}"></label></div>`).join('')}</div>
      <div class="videos-title"><h3>视频内容（${category.videos.length}）</h3><button data-action="video-add" data-ci="${ci}">＋ 添加视频</button></div><div>${category.videos.map((video,vi)=>`
        <article class="video"><div class="video-media">${video.src?`<video src="..${escapeHtml(video.src)}" poster="..${escapeHtml(video.poster||'')}" controls preload="metadata"></video>`:'<div class="empty">等待上传视频</div>'}<label>选择视频<input type="file" accept="video/mp4,video/webm" data-upload="video" data-ci="${ci}" data-vi="${vi}" data-vfield="src"></label><label>选择封面<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="poster" data-ci="${ci}" data-vi="${vi}" data-vfield="poster"></label></div>
        <div class="video-fields"><div class="video-toolbar"><strong>${String(vi+1).padStart(2,'0')} · ${escapeHtml(video.title||'未命名视频')}</strong><div class="row-actions"><button data-action="video-up" data-ci="${ci}" data-vi="${vi}">↑</button><button data-action="video-down" data-ci="${ci}" data-vi="${vi}">↓</button><button class="danger" data-action="video-remove" data-ci="${ci}" data-vi="${vi}">移除</button></div></div>
        ${videoField('视频标题',video.title,ci,vi,'title')}${videoField('视频小标题',video.subtitle,ci,vi,'subtitle')}${videoField('视频文件路径',video.src,ci,vi,'src')}${videoField('封面文件路径',video.poster,ci,vi,'poster')}${videoField('任务背景',video.task,ci,vi,'task',true,true)}${videoField('本人职责',video.role,ci,vi,'role',true,true)}${videoField('参考 / 创意方向',video.direction,ci,vi,'direction',true,true)}${videoField('生成与后期方法',video.method,ci,vi,'method',true,true)}${videoField('关键修正',video.correction,ci,vi,'correction',true,true)}${videoField('成片说明',video.delivery,ci,vi,'delivery',true,true)}${videoField('投放数据',video.data,ci,vi,'data',true,true)}</div></article>`).join('')}</div></div></section>`).join('')}
    root.addEventListener('input',event=>{const input=event.target,ci=Number(input.dataset.ci);if(!Number.isInteger(ci))return;if(input.dataset.field)library.categories[ci][input.dataset.field]=input.value;if(input.dataset.cover!==undefined&&input.type!=='file')library.categories[ci].covers[Number(input.dataset.cover)]=input.value;if(input.dataset.vfield&&input.type!=='file')library.categories[ci].videos[Number(input.dataset.vi)][input.dataset.vfield]=input.value;markDirty()});
    root.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const ci=Number(button.dataset.ci),vi=Number(button.dataset.vi),action=button.dataset.action;if(action==='cat-up')move(library.categories,ci,ci-1);if(action==='cat-down')move(library.categories,ci,ci+1);if(action==='cat-remove'&&library.categories.length>1&&confirm('确定从网站移除这个分类？')){library.categories.splice(ci,1);render();markDirty()}if(action==='video-add'){library.categories[ci].videos.push({id:`video-${Date.now()}`,title:'新视频',subtitle:'请填写小标题',src:'',poster:'',task:'',role:'',direction:'',method:'',correction:'',delivery:'9:16 AI 商业短视频成片。',data:'暂未获得投放数据'});render();markDirty()}if(action==='video-up')move(library.categories[ci].videos,vi,vi-1);if(action==='video-down')move(library.categories[ci].videos,vi,vi+1);if(action==='video-remove'&&confirm('确定从这个分类移除该视频？')){library.categories[ci].videos.splice(vi,1);render();markDirty()}});
    root.addEventListener('change',async event=>{const input=event.target;if(input.type!=='file'||!input.dataset.upload||!input.files[0])return;const ci=Number(input.dataset.ci),category=library.categories[ci],file=input.files[0],data=new FormData();data.append('file',file);data.append('categorySlug',category.slug);data.append('kind',input.dataset.upload==='video'?'video':'image');setStatus(`正在上传 ${file.name}…`);try{const response=await fetch('/api/upload',{method:'POST',body:data}),result=await response.json();if(!response.ok)throw new Error(result.error);if(input.dataset.cover!==undefined)category.covers[Number(input.dataset.cover)]=result.path;else category.videos[Number(input.dataset.vi)][input.dataset.vfield]=result.path;render();markDirty();setStatus(`${file.name} 已上传，请保存草稿。`,'good')}catch(error){setStatus(error.message,'bad')}});
    async function save(){setStatus('正在保存…');const response=await fetch('/api/library',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(library)}),result=await response.json();if(!response.ok)throw new Error(result.error);dirty=false;setStatus(result.message,'good');return result}
    document.querySelector('#saveButton').addEventListener('click',async()=>{try{await save()}catch(error){setStatus(error.message,'bad')}});
    document.querySelector('#publishButton').addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;try{await save();setStatus('正在检查并发布，通常需要 1–3 分钟，请不要关闭此页面…');const response=await fetch('/api/publish',{method:'POST'}),result=await response.json();if(!response.ok)throw new Error(result.error);setStatus(result.message,'good')}catch(error){setStatus(error.message,'bad')}finally{button.disabled=false}});
    document.querySelector('#addCategory').addEventListener('click',()=>{library.categories.push({slug:`new-category-${Date.now().toString().slice(-6)}`,eyebrow:'NEW CATEGORY / AI VIDEO',title:'新视频分类',subtitle:'请填写分类小标题',description:'请填写分类说明。',tone:'mass',covers:['',''],videos:[]});render();markDirty()});
    window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
    fetch('/api/library').then(response=>response.json()).then(data=>{library=data;render();setStatus('内容已载入。修改后先保存草稿，确认无误再发布。','good')}).catch(error=>setStatus(error.message,'bad'));
  </script>
</body>
</html>
